# Автосборка WinForge.exe.
#
# - Метка версии (git tag v1.0 && git push origin v1.0) — GitHub собирает exe на своём
#   сервере с Windows и выкладывает релиз с файлом WinForge.exe. Кнопка DOWNLOAD в README
#   всегда ведёт на последний релиз.
# - Вкладка Actions → Release → Run workflow — пробная сборка без релиза (exe в Artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Cargo.lock поправлен вручную (windows 0.58 для DirectX 12), поэтому --locked.
      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Prepare
        shell: pwsh
        run: Copy-Item target/release/winforge.exe WinForge.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinForge
          path: WinForge.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WinForge.exe
          generate_release_notes: true
