# Каталог программ для установки.
# Меню в программе строится из этого файла автоматически:
# добавь новую запись [[category.app]] — и она появится в интерфейсе.
#
# Тексты на двух языках: description = { uk = "...", en = "..." }
# Если текст одинаковый (название бренда) — можно просто строкой: name = "Discord"
#
# winget   — ID пакета в winget (проверить: winget search <имя>)
# presets  — в каких пресетах программа отмечается автоматически: base, gamer, dev

