# Встроенные приложения и компоненты Windows, которые можно удалить.
# Страница «Удаление» показывает пункты по разделам [[group]] в их порядке;
# у каждого пункта group = "<id раздела>".
# package — понятное описание пакетов для интерфейса (на действия не влияет)
# actions — как в privacy.toml:
#   { appx = "Microsoft.X" }   удалить пакет у всех пользователей и из образа (без отката);
#                              можно с масками: '*CandyCrush*'
#   { capability = "Microsoft.Windows.WordPad" }   старая возможность Windows (все версии и языки);
#                              откат — вернуть удалённое через Windows Update
#   OneDrive и Edge удаляются собственными деинсталляторами через run.
# Тексты на двух языках: name = { uk = "...", en = "..." }

[[group]]
id = "ms"
icon = "🗑"
name = { uk = "Застосунки Microsoft", en = "Microsoft apps" }
description = { uk = "Те, що Windows ставить сама. Зелені пункти можна видаляти сміливо.", en = "What Windows installs on its own. Green items are safe to remove." }

[[group]]
id = "partners"
icon = "📢"
name = { uk = "Реклама від партнерів", en = "Partner promotions" }
description = { uk = "Ігри та пробні програми, які Microsoft і виробники ПК підсовують у «Пуск».", en = "Games and trial apps that Microsoft and PC makers push into Start." }

[[group]]
id = "oem"
icon = "💻"
name = { uk = "Утиліти виробників ноутбуків", en = "Laptop maker utilities" }
description = { uk = "Мають сенс лише на вже встановленій системі: у чистому образі їх немає.", en = "Only matter on an installed system: a clean image doesn't have them." }

[[group]]
id = "legacy"
icon = "🧩"
name = { uk = "Старі компоненти Windows", en = "Legacy Windows components" }
description = { uk = "Застарілі програми, які досі займають місце. Повернути можна в «Додаткових компонентах».", en = "Outdated programs that still take up space. You can bring them back in Optional features." }

[[app]]
id = "rm-xbox"
name = { uk = "Застосунки Xbox", en = "Xbox apps" }
package = "Microsoft.GamingApp, Microsoft.XboxGamingOverlay, ..."
risk = "moderate"
group = "ms"
warning = { uk = "Не видаляй, якщо користуєшся Game Pass або іграми з Microsoft Store.", en = "Keep these if you use Game Pass or games from the Microsoft Store." }
actions = [
  { appx = "Microsoft.GamingApp" },
  { appx = "Microsoft.XboxApp" },
  { appx = "Microsoft.XboxGamingOverlay" },
  { appx = "Microsoft.XboxGameOverlay" },
  { appx = "Microsoft.XboxSpeechToTextOverlay" },
  { appx = "Microsoft.XboxIdentityProvider" },
  { appx = "Microsoft.Xbox.TCUI" },
]

[[app]]
id = "rm-onedrive"
name = "OneDrive"
package = { uk = "OneDriveSetup.exe + автозапуск", en = "OneDriveSetup.exe + autostart" }
risk = "moderate"
group = "ms"
warning = { uk = "На вже встановленій системі файли, які зберігаються лише в хмарі, стануть недоступні, доки OneDrive не встановити знову. Спершу збережи потрібні файли локально. Для нового образу — безпечно.", en = "On an installed system, files that live only in the cloud become unavailable until OneDrive is reinstalled. Make the files you need available offline first. For a fresh image it's safe." }
actions = [
  { run = 'Get-Process OneDrive -ErrorAction SilentlyContinue | Stop-Process -Force; $s = @("$env:SystemRoot\System32\OneDriveSetup.exe", "$env:SystemRoot\SysWOW64\OneDriveSetup.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1; if ($s) { Start-Process -FilePath $s -ArgumentList "/uninstall" -Wait } elseif (Get-Command winget -ErrorAction SilentlyContinue) { winget uninstall --id Microsoft.OneDrive -e --silent --accept-source-agreements --disable-interactivity } else { throw "Neither OneDriveSetup.exe nor winget was found" }', undo = "winget install --id Microsoft.OneDrive -e --silent --accept-source-agreements --accept-package-agreements", shell = "powershell", when = "live" },
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run', name = "OneDriveSetup", delete = true, when = "image" },
]

