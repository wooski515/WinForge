[[app]]
id = "rm-edge"
name = "Microsoft Edge"
package = "Microsoft.MicrosoftEdge.Stable"
risk = "danger"
group = "ms"
warning = { uk = "Edge глибоко вбудований у Windows. Деякі посилання із системи перестануть відкриватися, а оновлення можуть повернути його. WebView2 (потрібен багатьом програмам) не видалятиметься.", en = "Edge is deeply built into Windows. Some system links will stop opening, and updates may bring it back. WebView2 (needed by many apps) is not removed." }
actions = [
  { reg = 'HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdateDev', name = "AllowUninstall", sz = "" },
  { run = '$s = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\*\Installer\setup.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1; if ($s) { $f = "$env:SystemRoot\SystemApps\Microsoft.MicrosoftEdge_8wekyb3d8bbwe\MicrosoftEdge.exe"; $made = -not (Test-Path $f); if ($made) { New-Item -Path $f -ItemType File -Force | Out-Null }; try { Start-Process -FilePath $s.FullName -ArgumentList "--uninstall --system-level --force-uninstall" -Wait -WindowStyle Hidden } finally { if ($made) { Remove-Item -Path $f -Force -ErrorAction SilentlyContinue } }; if (Test-Path "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") { throw "Microsoft Edge is still installed" } }', undo = "winget install --id Microsoft.Edge -e --silent --accept-source-agreements --accept-package-agreements", shell = "powershell" },
]

