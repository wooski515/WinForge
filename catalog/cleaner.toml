[[group]]
name = { uk = "Програми", en = "Apps" }
icon = "🎮"

[[group.item]]
id = "clean-discord"
name = { uk = "Кеш Discord", en = "Discord cache" }
description = { uk = "Картинки й відео з чатів", en = "Images and videos from chats" }
risk = "safe"
recommended = true
details = ["%APPDATA%\\discord\\Cache", "%APPDATA%\\discord\\Code Cache"]
paths = [
  '%APPDATA%\discord\Cache',
  '%APPDATA%\discord\Code Cache',
  '%APPDATA%\discord\GPUCache',
]

[[group.item]]
id = "clean-steam"
name = { uk = "Веб-кеш Steam", en = "Steam web cache" }
description = { uk = "Кеш вбудованого браузера Steam", en = "Steam's built-in browser cache" }
risk = "safe"
recommended = true
details = ["%LOCALAPPDATA%\\Steam\\htmlcache"]
paths = [
  '%LOCALAPPDATA%\Steam\htmlcache',
]

[[group.item]]
id = "clean-telegram"
name = { uk = "Медіакеш Telegram", en = "Telegram media cache" }
description = { uk = "Фото й відео з чатів завантажаться знову", en = "Chat photos and videos will download again" }
risk = "moderate"
details = ["%APPDATA%\\Telegram Desktop\\tdata\\user_data"]
paths = [
  '%APPDATA%\Telegram Desktop\tdata\user_data*\cache',
  '%APPDATA%\Telegram Desktop\tdata\user_data*\media_cache',
]

[[group.item]]
id = "clean-shadercache"
name = { uk = "Кеш шейдерів відеокарти", en = "GPU shader cache" }
description = { uk = "Ігри перший раз запускатимуться трохи довше", en = "Games take a little longer to load the first time" }
risk = "moderate"
details = ["%LOCALAPPDATA%\\NVIDIA\\DXCache", "%LOCALAPPDATA%\\D3DSCache"]
paths = [
  '%LOCALAPPDATA%\NVIDIA\DXCache',
  '%LOCALAPPDATA%\NVIDIA\GLCache',
  '%USERPROFILE%\AppData\LocalLow\NVIDIA\PerDriverVersion\DXCache',
  '%LOCALAPPDATA%\D3DSCache',
  '%LOCALAPPDATA%\AMD\DxCache',
  '%LOCALAPPDATA%\AMD\DxcCache',
  '%LOCALAPPDATA%\AMD\GLCache',
  '%LOCALAPPDATA%\AMD\VkCache',
  '%LOCALAPPDATA%\Intel\ShaderCache',
]
