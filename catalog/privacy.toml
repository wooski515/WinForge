# Твики приватности и телеметрии.
#
# Тексты на двух языках: name = { uk = "...", en = "..." }
# risk        — safe (безопасно) | moderate (осторожно) | danger (опасно, спросит подтверждение)
# recommended — включается кнопкой «Применить рекомендуемое»
# warning     — текст предупреждения для опасных твиков
# details     — технические строки только у пунктов без actions (для остальных интерфейс
#               строит их из actions сам)
#
# actions — что реально делает твик. Каждая запись — inline-таблица в одну строку:
#   { reg = 'HKLM\...', name = "X", dword = 1 }        значение реестра; типы: dword, qword, sz,
#                                                       expand, multi = ["a", "b"], binary = "02 00";
#                                                       name = "" — значение «(По умолчанию)»
#   { reg = '...', name = "X", delete = true }          удалить значение (без name — весь раздел)
#   { service = "Имя", start = "disabled" }             тип запуска: auto | delayed | manual | disabled
#   { task = '\Microsoft\Windows\...', enabled = false } задача планировщика (полный путь, без масок)
#   { appx = "Microsoft.X" }                            удалить Appx у всех пользователей и из образа
#   { feature = "SMB1Protocol", enabled = false }       компонент Windows (DISM)
#   { run = "команда", undo = "откат", shell = "powershell" }  по умолчанию cmd.exe; откат — только undo
#   when = "live" | "image" — необязательно: только для работающей системы или только для образа
#                             (в образе run попадает в скрипт первого запуска).
#   check = "..." — для run: проверка в той же оболочке; печатает True — уже применено.
#
# avoid = ["laptop" | "hdd" | "ssd"] — пункт не советуется на таком ПК (в режиме «Цей Windows»
#                                      помечается и не включается кнопками «Рекомендовані»).
# [[group.preset]] — готовый режим группы: name, description, tweaks = ["id", ...];
#                    кнопка включает ровно эти пункты группы и снимает остальные.
# Корни реестра: HKLM, HKCU, HKCR, HKU. Пути и команды — литеральные строки '...', поэтому
# обратные слэши не экранируются; если в команде нужны одинарные кавычки — '''...'''.

[[group]]
name = { uk = "Служби телеметрії та діагностики", en = "Telemetry and diagnostics services" }
description = { uk = "Фонові служби, які збирають і надсилають дані до Microsoft.", en = "Background services that collect data and send it to Microsoft." }

[[group.tweak]]
id = "svc-diagtrack"
name = "DiagTrack — Connected User Experiences and Telemetry"
description = { uk = "Головна служба телеметрії Windows", en = "The main Windows telemetry service" }
risk = "safe"
recommended = true
actions = [
  { service = "DiagTrack", start = "disabled" },
]

