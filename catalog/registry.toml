# Исправления типичных проблем Windows. Формат как у твиков, пункты — [[group.item]].
# Это разовые действия: отметил → нажал «Виправити».
# actions — как в privacy.toml. Разблокировка — удаление запрещающих значений политик в HKCU и HKLM;
# обслуживание — команды run с when = "live" (в образ не попадают).

[[group]]
name = { uk = "Розблокувати системні інструменти", en = "Unblock system tools" }
description = { uk = "Віруси та деякі «оптимізатори» вимикають ці інструменти через політики. Тут їх можна повернути.", en = "Malware and some 'optimizers' block these tools through policies. Turn them back on here." }
icon = "🔓"

[[group.item]]
id = "fix-taskmgr"
name = { uk = "Диспетчер завдань", en = "Task Manager" }
description = { uk = "Прибирає заборону DisableTaskMgr", en = "Removes the DisableTaskMgr block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System', name = "DisableTaskMgr", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name = "DisableTaskMgr", delete = true },
]

[[group.item]]
id = "fix-cmd"
name = { uk = "Командний рядок", en = "Command Prompt" }
description = { uk = "Прибирає заборону DisableCMD", en = "Removes the DisableCMD block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Policies\Microsoft\Windows\System', name = "DisableCMD", delete = true },
  { reg = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name = "DisableCMD", delete = true },
]

[[group.item]]
id = "fix-regedit"
name = { uk = "Редактор реєстру", en = "Registry Editor" }
description = { uk = "Прибирає заборону DisableRegistryTools", en = "Removes the DisableRegistryTools block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\System', name = "DisableRegistryTools", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name = "DisableRegistryTools", delete = true },
]

[[group.item]]
id = "fix-controlpanel"
name = { uk = "Панель керування та Параметри", en = "Control Panel and Settings" }
description = { uk = "Прибирає заборону NoControlPanel", en = "Removes the NoControlPanel block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoControlPanel", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoControlPanel", delete = true },
]

[[group.item]]
id = "fix-folderoptions"
name = { uk = "Параметри папок", en = "Folder Options" }
description = { uk = "Прибирає заборону NoFolderOptions", en = "Removes the NoFolderOptions block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoFolderOptions", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoFolderOptions", delete = true },
]

[[group.item]]
id = "fix-run"
name = { uk = "Вікно «Виконати» (Win+R)", en = "Run dialog (Win+R)" }
description = { uk = "Прибирає заборону NoRun", en = "Removes the NoRun block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoRun", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoRun", delete = true },
]

[[group.item]]
id = "fix-contextmenu"
name = { uk = "Контекстне меню (правий клік)", en = "Right-click menu" }
description = { uk = "Прибирає заборону NoViewContextMenu", en = "Removes the NoViewContextMenu block" }
risk = "safe"
recommended = true
actions = [
  { reg = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoViewContextMenu", delete = true },
  { reg = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name = "NoViewContextMenu", delete = true },
